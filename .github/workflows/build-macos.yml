name: Build plugins (macOS, Windows, Linux)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write          # needed to publish releases

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJX_COPY_PLUGIN=OFF -DJX_BUILD_NUMBER=${{ github.run_number }}

      - name: "Build VST3 + AU (universal: Apple Silicon + Intel)"
        run: cmake --build build --config Release -j 4

      - name: Sign (ad-hoc)
        run: |
          codesign --force --deep --sign - "build/JXStepSequencer_artefacts/Release/VST3/JX Step Sequencer.vst3"
          codesign --force --deep --sign - "build/JXStepSequencerAU_artefacts/Release/AU/JX Step Sequencer.component"

      - name: Build installer (.pkg) with VST3 + AU
        run: |
          VERSION="1.0.${{ github.run_number }}"
          ROOT="$RUNNER_TEMP/pkgroot"
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components"
          cp -R "build/JXStepSequencer_artefacts/Release/VST3/JX Step Sequencer.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/JXStepSequencerAU_artefacts/Release/AU/JX Step Sequencer.component" "$ROOT/Library/Audio/Plug-Ins/Components/"

          # Always install to the plug-in folders; never "update" a copy found elsewhere on the Mac
          pkgbuild --analyze --root "$ROOT" "$RUNNER_TEMP/components.plist"
          for i in 0 1; do plutil -replace $i.BundleIsRelocatable -bool NO "$RUNNER_TEMP/components.plist"; done

          pkgbuild --root "$ROOT" \
                   --component-plist "$RUNNER_TEMP/components.plist" \
                   --identifier com.ticcoross.jxstepsequencer \
                   --version "$VERSION" \
                   --install-location / \
                   "$RUNNER_TEMP/component.pkg"
          productbuild --package "$RUNNER_TEMP/component.pkg" "JX-Step-Sequencer-Installer.pkg"

          ditto -c -k --keepParent "build/JXStepSequencer_artefacts/Release/VST3/JX Step Sequencer.vst3" "JX-Step-Sequencer-VST3-macOS.zip"
          ditto -c -k --keepParent "build/JXStepSequencerAU_artefacts/Release/AU/JX Step Sequencer.component" "JX-Step-Sequencer-AU-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            JX-Step-Sequencer-Installer.pkg
            JX-Step-Sequencer-VST3-macOS.zip
            JX-Step-Sequencer-AU-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DJX_COPY_PLUGIN=OFF -DJX_BUILD_NUMBER=${{ github.run_number }}

      - name: Build VST3
        run: cmake --build build --config Release

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "build/JXStepSequencer_artefacts/Release/VST3/JX Step Sequencer.vst3" -DestinationPath "JX-Step-Sequencer-VST3-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: JX-Step-Sequencer-VST3-Windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libfreetype6-dev libfontconfig1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJX_COPY_PLUGIN=OFF -DJX_BUILD_NUMBER=${{ github.run_number }}

      - name: Build VST3
        run: cmake --build build --config Release -j 4

      - name: Pack
        run: |
          cd build/JXStepSequencer_artefacts/Release/VST3
          tar -czf "$GITHUB_WORKSPACE/JX-Step-Sequencer-VST3-Linux.tar.gz" "JX Step Sequencer.vst3"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: JX-Step-Sequencer-VST3-Linux.tar.gz

  release:
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v$VERSION" \
            dist/JX-Step-Sequencer-Installer.pkg \
            dist/JX-Step-Sequencer-VST3-macOS.zip \
            dist/JX-Step-Sequencer-AU-macOS.zip \
            dist/JX-Step-Sequencer-VST3-Windows.zip \
            dist/JX-Step-Sequencer-VST3-Linux.tar.gz \
            docs/JX-Step-Sequencer-Manual.pdf \
            docs/JX-Step-Sequencer-Update-History.pdf \
            --title "JX Step Sequencer $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. macOS: run JX-Step-Sequencer-Installer.pkg (VST3 + AU). Windows / Linux: unzip the VST3 into your VST3 folder. Manual: JX-Step-Sequencer-Manual.pdf. What's new: JX-Step-Sequencer-Update-History.pdf." \
            --latest
